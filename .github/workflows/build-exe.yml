name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'version.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          & "$env:USERPROFILE\.local\bin\poetry" install --no-interaction --no-root

      - name: Create Version File
        run: |
          & "$env:USERPROFILE\.local\bin\poetry" run create-version-file h9_ui_flash.yaml --outfile h9_ui_flash.txt

      - name: Build EXE with PyInstaller
        run: |
          & "$env:USERPROFILE\.local\bin\poetry" run pyinstaller --clean --paths . --version-file="h9_ui_flash.txt" -i "h9_ui_flash.ico" --noconsole --onefile --name="h9_ui_flash" ui_app/app.py
          if (Test-Path h9_ui_flash.txt) { Remove-Item h9_ui_flash.txt }

      - name: Compress EXE with UPX
        run: .\tools\upx.exe -9f dist\h9_ui_flash.exe

      - name: Save EXE to Job Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h9_ui_flash
          path: dist/h9_ui_flash.exe
          compression-level: 0
